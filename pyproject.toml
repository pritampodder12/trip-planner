[project]
name = "trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pritam Podder", email = "pritampodder12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "boto3>=1.43.122",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-aws>=1.9.1",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
